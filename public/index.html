<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sanlam Mrirt — Tableau de bord agent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #0d1117; color: #e6edf3; height: 100vh; display: flex;
  }
  #login-screen {
    margin: auto; background: #161b22; padding: 32px; border-radius: 12px;
    width: 320px; border: 1px solid #30363d;
  }
  #login-screen h1 { font-size: 18px; margin-bottom: 20px; }
  #login-screen input {
    width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
  }
  #login-screen button, .send-btn {
    width: 100%; padding: 10px; border-radius: 6px; border: none;
    background: #238636; color: white; font-weight: 600; cursor: pointer;
  }
  #error-msg { color: #f85149; font-size: 13px; margin-top: 8px; min-height: 16px; }

  #app { display: none; width: 100%; height: 100%; }
  #app.active { display: flex; }

  #sidebar {
    width: 300px; border-right: 1px solid #30363d; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  #sidebar-header { padding: 16px; border-bottom: 1px solid #30363d; }
  #stats { padding: 12px 16px; font-size: 12px; color: #8b949e; border-bottom: 1px solid #30363d; }
  .ticket-item {
    padding: 12px 16px; border-bottom: 1px solid #21262d; cursor: pointer;
  }
  .ticket-item:hover { background: #161b22; }
  .ticket-item.active { background: #1f2937; }
  .ticket-subject { font-weight: 600; font-size: 14px; }
  .ticket-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #30363d;
  }
  .badge.open { background: #1f6feb33; color: #58a6ff; }
  .badge.closed { background: #23863633; color: #3fb950; }

  #chat-panel { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 16px; border-bottom: 1px solid #30363d; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 60%; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
  .msg.client { background: #21262d; align-self: flex-start; }
  .msg.agent { background: #1f6feb; align-self: flex-end; }
  .msg-meta { font-size: 11px; opacity: 0.6; margin-top: 4px; }
  #composer { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #30363d; }
  #composer input {
    flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d;
    background: #0d1117; color: #e6edf3;
  }
  .send-btn { width: auto; padding: 10px 20px; }
  #empty-state { margin: auto; color: #8b949e; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Connexion agent</h1>
  <input type="email" id="login-email" placeholder="Email" />
  <input type="password" id="login-password" placeholder="Mot de passe" />
  <button onclick="login()">Se connecter</button>
  <div id="error-msg"></div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <strong>Tickets</strong>
    </div>
    <div id="stats">Chargement des statistiques...</div>
    <div id="ticket-list"></div>
  </div>
  <div id="chat-panel">
    <div id="empty-state">Sélectionnez un ticket à gauche</div>
  </div>
</div>

<script>
let token = null;
let currentUser = null;
let currentTicketId = null;
let ws = null;

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(options.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('error-msg');
  errorEl.textContent = '';
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    token = data.token;
    currentUser = data.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    loadTickets();
    loadStats();
  } catch (e) {
    errorEl.textContent = e.message;
  }
}

async function loadStats() {
  try {
    const data = await api('/stats');
    document.getElementById('stats').textContent =
      `${data.open_tickets} ouverts · ${data.total_tickets} au total · ${data.messages_today} messages aujourd'hui`;
  } catch (e) { /* silencieux */ }
}

async function loadTickets() {
  const data = await api('/tickets');
  const list = document.getElementById('ticket-list');
  list.innerHTML = '';
  data.tickets.forEach((t) => {
    const el = document.createElement('div');
    el.className = 'ticket-item' + (t.id === currentTicketId ? ' active' : '');
    el.onclick = () => openTicket(t.id);
    el.innerHTML = `
      <div class="ticket-subject">${escapeHtml(t.subject)}</div>
      <div class="ticket-meta">
        <span class="badge ${t.status}">${t.status}</span>
        &nbsp;${escapeHtml(t.client_name || 'Client')}
      </div>`;
    list.appendChild(el);
  });
}

async function openTicket(id) {
  currentTicketId = id;
  loadTickets();
  const data = await api('/tickets/' + id);
  renderChat(data.ticket, data.messages);
  connectWs(id);
}

function renderChat(ticket, messages) {
  const panel = document.getElementById('chat-panel');
  panel.innerHTML = `
    <div id="chat-header">
      <strong>${escapeHtml(ticket.subject)}</strong>
      <div class="ticket-meta">${escapeHtml(ticket.client_name || '')} — ${escapeHtml(ticket.client_email || '')}</div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <input id="msg-input" placeholder="Écrire un message..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">Envoyer</button>
    </div>
  `;
  const msgEl = document.getElementById('messages');
  messages.forEach(addMessageToDom);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function addMessageToDom(m) {
  const msgEl = document.getElementById('messages');
  if (!msgEl) return;
  const div = document.createElement('div');
  div.className = 'msg ' + (m.role || m.sender_type);
  div.innerHTML = `${escapeHtml(m.body)}<div class="msg-meta">${escapeHtml(m.senderName || m.sender_name || '')}</div>`;
  msgEl.appendChild(div);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function connectWs(ticketId) {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/live`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', ticketId, role: 'agent' }));
  };
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'message') addMessageToDom(data);
  };
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const body = input.value.trim();
  if (!body || !ws) return;
  ws.send(JSON.stringify({
    type: 'message',
    ticketId: currentTicketId,
    role: 'agent',
    senderName: currentUser ? currentUser.name || currentUser.email : 'agent',
    body,
  }));
  input.value = '';
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
</script>
</body>
</html>
