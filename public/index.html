<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A44">
<title>Assistant Sanlam Mrirt</title>
<style>
  :root{
    --navy:#0064B0; --navy-light:#1E7FC2; --navy-dark:#004B85;
    --gold:#F4A611; --gold-light:#FBC96B; --paper:#F5F8FA; --ink:#1F2933;
    --slate:#64748B; --alert:#F4A611; --alert-dark:#8A5A00; --ok:#2E9E86; --line:#E2E8F0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;
    background:linear-gradient(160deg,#003F6E 0%,#0064B0 55%,#1E7FC2 100%);
    font-family:"Helvetica Neue","Arial",sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;overscroll-behavior:none;}
  .stage{width:100%;max-width:460px;height:100%;max-height:720px;padding:18px;}
  .phone{position:relative;height:100%;display:flex;flex-direction:column;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px -18px rgba(15,42,68,.45),0 0 0 1px var(--line);}
  @media (max-width:600px){.stage{max-width:none;padding:0;height:100dvh;}.phone{border-radius:0;max-height:none;height:100dvh;}.head{padding-top:calc(20px + env(safe-area-inset-top));}.composer{padding-bottom:calc(16px + env(safe-area-inset-bottom));}}
  .head{position:relative;background:#fff;color:var(--ink);padding:18px 20px 14px;border-bottom:1px solid var(--line);}
  .head-row{display:flex;align-items:center;gap:10px;}
  .badge{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto;box-shadow:0 3px 8px rgba(0,100,176,.25);}
  .agency-pill{font-size:10.5px;font-weight:700;color:var(--navy);background:#EAF3FB;border:1px solid #CFE3F4;border-radius:999px;padding:4px 10px;white-space:nowrap;margin-right:auto;}
  .head-sub{margin:8px 0 0;font-size:11.5px;color:var(--slate);}
  .head-actions{display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{width:32px;height:32px;border-radius:9px;border:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:700;}
  .icon-btn:active{background:var(--navy-dark);}
  .slogan{margin-top:9px;font-style:italic;font-size:12px;color:var(--navy);padding-top:8px;border-top:1px solid var(--line);}
  .status{margin-top:7px;font-size:11px;color:var(--slate);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(46,158,134,.18);}
  .thread{flex:1;overflow-y:auto;padding:18px 16px 10px;background:var(--paper);display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;animation:msgIn .32s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .row.bot{justify-content:flex-start;align-items:flex-end;gap:8px;}
  .row.user{justify-content:flex-end;}
  .bot-avatar{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-bottom:2px;box-shadow:0 2px 5px rgba(0,100,176,.25);}
  html[dir="rtl"] .row.bot{justify-content:flex-end;flex-direction:row-reverse;}
  html[dir="rtl"] .row.user{justify-content:flex-start;}
  html[dir="rtl"] .row.bot .bubble{border-bottom-left-radius:14px;border-bottom-right-radius:4px;}
  html[dir="rtl"] .row.user .bubble{border-bottom-right-radius:14px;border-bottom-left-radius:4px;}
  html[dir="rtl"] body{font-family:"Geeza Pro","Arial",sans-serif;}
  html[dir="rtl"] .bubble,html[dir="rtl"] .chip,html[dir="rtl"] .faq-cat,html[dir="rtl"] .faq-q{text-align:right;}
  .bubble{font-size:14px;line-height:1.45;padding:10px 14px;border-radius:14px;max-width:82%;white-space:pre-line;}
  .row.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink);}
  .row.user .bubble{background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
  .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--slate);margin:2px 2px 0;}
  .typing{display:flex;gap:4px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px;width:52px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--slate);opacity:.5;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}
  .call-card{border:1.5px solid var(--gold);background:#FEF6E7;border-radius:14px;padding:14px;}
  .call-card .num{font-size:26px;font-weight:700;color:var(--alert-dark);letter-spacing:1px;}
  .call-card a.dial{display:inline-block;margin-top:8px;background:var(--gold);color:#fff;text-decoration:none;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;}
  .ticket-card{border:1.5px dashed var(--gold);background:#FBF6E8;border-radius:14px;padding:14px;}
  .ticket-id{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:.5px;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:6px;}
  .pill.open{background:#FDEBD0;color:#8A5A00;}
  .pill.progress{background:#DDEBFB;color:#1C4B80;}
  .pill.done{background:#DCEFE1;color:#276443;}
  .choices{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 2px;animation:msgIn .32s cubic-bezier(.2,.7,.3,1) both;}
  .chip{border:1.4px solid var(--navy);color:var(--navy);background:#fff;padding:10px 15px;border-radius:999px;font-size:13.5px;cursor:pointer;transition:transform .12s ease,background .15s ease;min-height:40px;display:flex;align-items:center;}
  .chip:hover{background:var(--navy);color:#fff;transform:translateY(-1px);}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .chip.gold{border-color:var(--gold);color:#8A5A00;}
  .chip.gold:hover{background:var(--gold);color:#fff;}
  .navbar{display:flex;background:#fff;border-bottom:1px solid var(--line);}
  .navbtn{flex:1;text-align:center;padding:10px 4px 8px;font-size:10.5px;color:var(--slate);cursor:pointer;border-right:1px solid var(--line);user-select:none;}
  .navbtn:last-child{border-right:none;}
  .navbtn .ic{font-size:17px;display:block;margin-bottom:2px;}
  .navbtn:active{background:var(--paper);}
  .navbtn.active{color:var(--navy);font-weight:700;box-shadow:inset 0 -3px 0 var(--navy);}
  .navbtn:focus-visible{outline:2px solid var(--navy);outline-offset:-2px;}
  .side-fab{position:absolute;right:10px;top:180px;display:flex;flex-direction:column;gap:8px;z-index:5;}
  @media (max-width:600px){.side-fab{top:calc(160px + env(safe-area-inset-top));right:8px;}}
  .fab{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.18);text-decoration:none;transition:transform .15s ease;}
  .fab:hover{transform:translateX(-2px) scale(1.04);}
  .fab.loc{background:var(--navy);}
  .fab.info{background:var(--navy-dark);}
  .fab.call{background:var(--gold);}
  .fab.wa{background:#25D366;}
  .success-pop{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;font-size:16px;margin-right:6px;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
  .faq-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px;}
  .faq-search input{border:none;outline:none;flex:1;font-size:13.5px;}
  .faq-cat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .faq-cat .ic{font-size:20px;}
  .faq-cat .lbl{font-size:13.5px;font-weight:600;color:var(--navy);flex:1;}
  .faq-cat .cnt{font-size:11px;color:var(--slate);}
  .faq-q{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:13px;color:var(--ink);cursor:pointer;margin-bottom:6px;}
  .faq-q:active{background:var(--paper);}
  .faq-q .tag{display:block;font-size:10px;color:var(--slate);margin-top:2px;}
  .attach-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .attach-btn{font-size:12px;border:1px dashed var(--slate);color:var(--slate);background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;}
  .attach-name{font-size:11.5px;color:var(--ok);}
  .attach-thumb{max-width:140px;max-height:140px;border-radius:10px;margin-top:8px;border:1px solid var(--line);display:block;}
  .privacy{font-size:10.5px;color:var(--slate);text-align:center;padding:6px 8px 2px;background:#fff;cursor:pointer;user-select:none;flex:1;}
  .privacy span{text-decoration:underline;}
  .footer-row{display:flex;background:#fff;border-top:1px solid var(--line);}
  .footer-row .privacy:first-child{border-right:1px solid var(--line);}
  .composer{display:flex;gap:8px;padding:12px 14px 16px;background:#fff;border-top:1px solid var(--line);}
  .composer input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-size:16px;outline:none;}
  .composer input:focus{border-color:var(--navy);}
  .composer button{background:var(--navy);color:#fff;border:none;border-radius:999px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
  .composer button:active{transform:scale(.97);}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="head">
      <div class="head-row">
        <div class="badge">SL</div>
        <span class="agency-pill" id="txtAgencyName">Agence Mrirt</span>
        <div class="head-actions">
          <div class="icon-btn" id="langBtn" role="button" tabindex="0" aria-label="Changer de langue">AR</div>
          <div class="icon-btn" id="resetBtn" role="button" tabindex="0" aria-label="Réinitialiser la conversation">⟲</div>
        </div>
      </div>
      <p id="txtSubtitle" class="head-sub">Service client · agence Mrirt</p>

    <div class="thread" id="thread" aria-live="polite"></div>

    <div class="side-fab">
      <div class="fab loc" id="fabLoc" title="Agence Mrirt" role="button" tabindex="0" aria-label="Localisation de l'agence">📍</div>

    </div>

    <div class="footer-row">
      <div class="privacy" id="privacyBtn">🔒 <span>Vos données sont traitées de façon confidentielle</span></div>
      <div class="privacy" id="aboutBtn">ℹ️ <span id="txtAbout">Agence Sanlam Mrirt</span></div>
    </div>

    <div class="composer">
      <input id="freeInput" type="text" placeholder="Écrivez votre message…" aria-label="Votre message" />
      <button id="sendBtn">Envoyer</button>
    </div>
  </div>
</div>

<script>
const thread = document.getElementById('thread');
const freeInput = document.getElementById('freeInput');
const sendBtn = document.getElementById('sendBtn');

/* ---------------- Connexion au backend ---------------- */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzhrXBtgCRD2OA2UzR_N7BBZ3iSPVqbhx0KdATV8fUpzC3AZFs4xFepQnDSZacQWd4/exec";

/* ---------------- i18n (FR / AR) ---------------- */
let LANG = 'fr';
const I18N = {
  fr:{ subtitle:"Service client · agence Mrirt",
       slogan:"« Live with confidence » — Vivez en toute confiance",
       status:"En ligne — réponse immédiate", placeholder:"Écrivez votre message…", send:"Envoyer",
       nav:{home:"Accueil", faq:"FAQ", urgence:"Urgence", suivi:"Suivi"},
       privacy:"Vos données sont traitées de façon confidentielle",
       about:"Agence Sanlam Mrirt",
       greet:"Bonjour 👋 Je suis l'assistant digital de l'agence <strong>Sanlam Mrirt</strong>. Comment puis-je vous aider aujourd'hui ?",
       menu:{urgence:"🚨 Sinistre en cours / urgence", faq:"📚 FAQ / Questions fréquentes", reclamation:"📋 Faire une réclamation", suivi:"🔍 Suivre une demande"},
       back:"⬅️ Retour au menu", searchPh:"Rechercher dans la FAQ…" },
  ar:{ subtitle:"خدمة الزبناء · وكالة مريرت",
       slogan:"« Live with confidence » — عيشوا بثقة",
       status:"متصل — إجابة فورية", placeholder:"اكتب رسالتك…", send:"إرسال",
       nav:{home:"الرئيسية", faq:"الأسئلة الشائعة", urgence:"استعجال", suivi:"تتبع"},
       privacy:"بياناتكم تُعامل بسرية تامة",
       about:"وكالة سنلام مريرت",
       greet:"مرحبا 👋 أنا المساعد الرقمي لوكالة <strong>سنلام مريرت</strong>. كيف يمكنني مساعدتكم اليوم؟",
       menu:{urgence:"🚨 حادثة جارية / استعجال", faq:"📚 الأسئلة الشائعة", reclamation:"📋 تقديم شكاية", suivi:"🔍 تتبع طلب"},
       back:"⬅️ رجوع للقائمة", searchPh:"البحث في الأسئلة الشائعة…" }
};

function applyLang(){
  const t = I18N[LANG];
  document.getElementById('txtSlogan').textContent = t.slogan;
  document.getElementById('txtSlogan').style.display = (LANG === 'ar') ? 'block' : 'none';
  document.getElementById('txtSubtitle').textContent = t.subtitle;
  document.getElementById('txtStatus').textContent = t.status;
  freeInput.placeholder = t.placeholder;
  sendBtn.textContent = t.send;
  document.querySelector('#navHome .navlbl').textContent = t.nav.home;
  document.querySelector('#navFaq .navlbl').textContent = t.nav.faq;
  document.querySelector('#navUrgence .navlbl').textContent = t.nav.urgence;
  document.querySelector('#navSuivi .navlbl').textContent = t.nav.suivi;
  document.querySelector('#privacyBtn span').textContent = t.privacy;
  document.getElementById('txtAbout').textContent = t.about;
  document.getElementById('langBtn').textContent = (LANG === 'fr') ? 'AR' : 'FR';
  document.getElementById('htmlRoot').setAttribute('lang', LANG);
  document.getElementById('htmlRoot').setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
}

document.getElementById('langBtn').onclick = ()=>{
  LANG = (LANG === 'fr') ? 'ar' : 'fr';
  applyLang();
  mainMenu();
};
onEnterOrSpace(document.getElementById('langBtn'), ()=> document.getElementById('langBtn').onclick());

function onEnterOrSpace(el, fn){
  el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fn(); } });
}

function scrollDown(){ thread.scrollTop = thread.scrollHeight; }

function addBot(html, eyebrow){
  const row = document.createElement('div');
  row.className = 'row bot';
  const avatar = `<div class="bot-avatar">SL</div>`;
  const content = (eyebrow ? `<div><div class="eyebrow">${eyebrow}</div><div class="bubble">${html}</div></div>` : `<div class="bubble">${html}</div>`);
  row.innerHTML = avatar + content;
  thread.appendChild(row);
  scrollDown();
}

function addUser(text){
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble"></div>`;
  row.querySelector('.bubble').textContent = text;
  thread.appendChild(row);
  scrollDown();
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  row.innerHTML = `<div class="bot-avatar">SL</div><div class="typing"><span></span><span></span><span></span></div>`;
  thread.appendChild(row);
  scrollDown();
}
function hideTyping(){
  const el = document.getElementById('typingRow');
  if(el) el.remove();
}
function botSay(html, eyebrow, delay){
  showTyping();
  setTimeout(()=>{ hideTyping(); addBot(html, eyebrow); }, delay || 500);
}

function addChoices(options, handler){
  const wrap = document.createElement('div');
  wrap.className = 'choices';
  options.forEach(opt=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (opt.gold ? ' gold' : '');
    chip.textContent = opt.label;
    chip.tabIndex = 0;
    chip.setAttribute('role','button');
    const act = ()=>{ addUser(opt.label); wrap.remove(); handler(opt.id); };
    chip.onclick = act;
    onEnterOrSpace(chip, act);
    wrap.appendChild(chip);
  });
  thread.appendChild(wrap);
  scrollDown();
}

function mainMenu(){
  thread.innerHTML = '';
  setActiveNav('navHome');
  const t = I18N[LANG];
  botSay(t.greet, null, 350);
  setTimeout(()=>{
    addChoices([
      {id:'urgence', label:t.menu.urgence},
      {id:'faq', label:t.menu.faq},
      {id:'reclamation', label:t.menu.reclamation},
      {id:'suivi', label:t.menu.suivi},
    ], route);
  }, 380);
}

function route(id){
  if(id==='urgence') return handleUrgence();
  if(id==='faq'||id==='question') return handleFAQ();
  if(id==='reclamation') return handleReclamation();
  if(id==='suivi') return handleSuivi();
}

function handleUrgence(){
  setActiveNav('navUrgence');
  botSay("Je comprends, c'est une situation urgente. Contactez immédiatement notre assistance, disponible 24h/24 et 7j/7 :");
  setTimeout(()=>{
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `
      <div class="call-card">
        <div class="num">34 34</div>
        <div style="font-size:13px;color:#8A6A2E;margin-top:4px;">ou 05 22 95 75 75 depuis un fixe / l'étranger</div>
        <a class="dial" href="tel:3434">📞 Appeler le 34 34</a>
      </div>`;
    thread.appendChild(row);
    scrollDown();
    setTimeout(()=>{
      botSay("Un conseiller vous guidera pas à pas. Je crée également un ticket de suivi pour que vous puissiez consulter l'évolution de votre dossier ici même.", "après l'appel", 500);
      setTimeout(()=> addChoices([{id:'restart', label:I18N[LANG].back}], route2), 900);
    }, 300);
  }, 500);
}

const FAQ_I18N = {
  fr: {
    auto: { icon:'🚗', label:'Assurance Auto', items:[
      {q:"Quelle est ma date d'échéance ?", a:"Votre prochaine échéance de prime est visible sur votre attestation ou dans l'application mobile Sanlam Maroc, rubrique « Mes contrats »."},
      {q:"Quelles garanties couvre mon contrat ?", a:"Vos garanties dépendent de la formule souscrite (Tiers, Tiers+, Tous Risques) et sont détaillées dans vos conditions particulières remises à la souscription."},
      {q:"Quels documents pour un sinistre auto ?", a:"Constat à l'amiable rempli et signé, carte grise, permis de conduire, et attestation d'assurance en cours de validité."},
      {q:"Comment obtenir mon attestation ?", a:"Votre attestation est disponible immédiatement dans l'application mobile Sanlam Maroc, ou peut être retirée à l'agence Mrirt."},
    ]},
    habitation: { icon:'🏠', label:'Assurance Habitation', items:[
      {q:"Que couvre l'assurance habitation ?", a:"Incendie, dégât des eaux, vol, bris de glace et responsabilité civile, selon la formule souscrite."},
      {q:"Un dégât des eaux, que faire ?", a:"Coupez l'arrivée d'eau, prenez des photos des dégâts, puis déclarez le sinistre au 05 22 48 04 80 (service Habitation) sous 5 jours."},
    ]},
    sante: { icon:'🩺', label:'Assurance Santé', items:[
      {q:"Comment se faire rembourser des soins ?", a:"Envoyez votre feuille de soins et vos justificatifs via l'application mobile ou déposez-les à l'agence ; le remboursement intervient sous quelques jours ouvrés."},
      {q:"Ma couverture santé est-elle valable à l'étranger ?", a:"Oui pour l'offre Assur'Santé International, avec une couverture pouvant atteindre 7,5 millions de dirhams par personne et par an."},
    ]},
    paiement: { icon:'💳', label:'Paiement & Résiliation', items:[

function faqData(){ return FAQ_I18N[LANG]; }

function handleFAQ(){
  setActiveNav('navFaq');
  botSay("Voici nos rubriques les plus consultées, ou utilisez la recherche 🔎 :");
  setTimeout(renderFaqHome, 450);
}

function renderFaqHome(){
  const FAQ = faqData();
  const wrap = document.createElement('div');

  const search = document.createElement('div');
  search.className = 'faq-search';
  search.innerHTML = `🔎 <input type="text" id="faqSearchInput" placeholder="${I18N[LANG].searchPh}" aria-label="Rechercher dans la FAQ" />`;
  wrap.appendChild(search);

  const results = document.createElement('div');
  results.id = 'faqResults';
  wrap.appendChild(results);

  const cats = document.createElement('div');
  cats.id = 'faqCats';
  Object.keys(FAQ).forEach(key=>{
    const cat = FAQ[key];
    const card = document.createElement('div');
    card.className = 'faq-cat';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.innerHTML = `<span class="ic">${cat.icon}</span><span class="lbl">${cat.label}</span><span class="cnt">${cat.items.length} questions</span>`;
    const act = ()=>{ addUser(cat.label); wrap.remove(); showFaqCategory(key); };
    card.onclick = act;
    onEnterOrSpace(card, act);
    cats.appendChild(card);
  });
  wrap.appendChild(cats);

  thread.appendChild(wrap);
  scrollDown();
  addChoices([{id:'restart', label:I18N[LANG].back}], route2);

  document.getElementById('faqSearchInput').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    results.innerHTML = '';
    if(!q){ cats.style.display=''; return; }
    cats.style.display='none';
    Object.keys(FAQ).forEach(key=>{
      FAQ[key].items.forEach(item=>{
        if(item.q.toLowerCase().includes(q)){
          const r = document.createElement('div');
          r.className = 'faq-q';
          r.tabIndex = 0;
          r.setAttribute('role','button');
          r.innerHTML = `› ${item.q}<span class="tag">${FAQ[key].icon} ${FAQ[key].label}</span>`;
          const act = ()=>{ addUser(item.q); wrap.remove(); addBot(item.a); addChoices([{id:'faq', label:'📚 Autres questions'},{id:'restart', label:I18N[LANG].back}], route2); };
          r.onclick = act;
          onEnterOrSpace(r, act);
          results.appendChild(r);
        }
      });
    });
    if(!results.children.length){
      results.innerHTML = `<div style="font-size:12.5px;color:var(--slate);padding:6px 2px;">Aucun résultat. Essayez un autre mot-clé.</div>`;
    }
  });
}

function showFaqCategory(key){
  const cat = faqData()[key];
  addBot(`${cat.icon} <strong>${cat.label}</strong> — sélectionnez votre question :`);
  const wrap = document.createElement('div');
  cat.items.forEach(item=>{
    const q = document.createElement('div');
    q.className = 'faq-q';
    q.tabIndex = 0;
    q.setAttribute('role','button');
    q.textContent = '› ' + item.q;
    const act = ()=>{ addUser(item.q); wrap.remove(); addBot(item.a); addChoices([
      {id:'faq', label:'📚 Autres catégories'},
      {id:'restart', label:I18N[LANG].back},
    ], route2); };
    q.onclick = act;
    onEnterOrSpace(q, act);
    wrap.appendChild(q);
  });
  thread.appendChild(wrap);
  scrollDown();
}

let awaitingReclamation = false;
let awaitingSuivi = false;
let pendingAttachment = null;

function handleReclamation(){
  botSay("Décrivez brièvement votre réclamation, je vous ouvre un ticket de suivi. Vous pouvez aussi joindre une photo ou un document ci-dessous.");
  setTimeout(()=>{
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `
      <div style="max-width:82%;">
        <div class="attach-row">
          <label class="attach-btn">📎 Joindre un fichier<input type="file" id="attachInput" accept="image/*,.pdf" style="display:none;"></label>
          <span class="attach-name" id="attachName"></span>
        </div>
        <img id="attachThumb" class="attach-thumb" style="display:none;" alt="Aperçu de la pièce jointe">
      </div>`;
    thread.appendChild(row);
    scrollDown();
    document.getElementById('attachInput').addEventListener('change', (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      pendingAttachment = f.name;
      document.getElementById('attachName').textContent = '✓ ' + f.name;
      const thumb = document.getElementById('attachThumb');
      if(f.type.startsWith('image/')){
        const reader = new FileReader();
        reader.onload = (ev)=>{ thumb.src = ev.target.result; thumb.style.display = 'block'; scrollDown(); };
        reader.readAsDataURL(f);
      } else {
        thumb.style.display = 'none';
      }
    });
  }, 450);
  awaitingReclamation = true;
}

function handleSuivi(){
  setActiveNav('navSuivi');
  awaitingSuivi = true;
  botSay("Indiquez le numéro de votre ticket (le numéro vous a été communiqué lors de l'enregistrement de votre réclamation) :");
}

async function showTicketRemote(id){
  showTyping();
  try{
    const resp = await fetch(BACKEND_URL + "?id=" + encodeURIComponent(id));
    hideTyping();
    if(!resp.ok) throw new Error('http '+resp.status);
    const data = await resp.json();
    if(data.error === 'not_found'){
      addBot("Je ne trouve pas ce numéro de ticket. Vérifiez-le ou contactez le 05 22 42 06 06.");
      return;
    }
    if(data.error) throw new Error(data.error);
    const t = data.ticket;
    const statutLabel = { open: 'Ouvert', pending: 'En cours', closed: 'Clôturé' }[t.status] || t.status;
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `
      <div class="ticket-card">
        <div class="ticket-id">Ticket #${t.id}</div>
        <span class="pill ${t.status}">${statutLabel}</span>
        <div style="font-size:13px;margin-top:8px;color:#3c4a56;">${t.subject}</div>
      </div>`;
    thread.appendChild(row);
    scrollDown();
    addChoices([{id:'restart', label:I18N[LANG].back}], route2);
  }catch(e){
    hideTyping();
    addBot("Désolé, impossible de contacter le service de suivi en ce moment. Merci de réessayer plus tard ou de contacter le 05 22 42 06 06.");
  }
}

function route2(id){
  if(id==='restart'){ mainMenu(); return; }
  route(id);
}

function keywordFallback(t){
  if(t.includes('urgence')||t.includes('accident')||t.includes('sinistre')) return 'urgence';
  if(t.includes('faq')||t.includes('question')||t.includes('garantie')||t.includes('échéance')||t.includes('echeance')) return 'faq';
  if(t.includes('ticket')||t.includes('tck')||t.includes('suivi')||t.includes('dossier')) return 'suivi';
  if(t.includes('réclam')||t.includes('reclam')) return 'reclamation';
  return 'autre';
}

async function handleFreeText(text){
  addUser(text);
  if(awaitingSuivi){
    awaitingSuivi = false;
    await showTicketRemote(text.trim());
    return;
  }
  if(awaitingReclamation){
    awaitingReclamation = false;
    const attachNote = pendingAttachment ? ` Pièce jointe reçue : ${pendingAttachment}.` : '';
    pendingAttachment = null;
    showTyping();
    try{
      const resp = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          subject: "Réclamation via chatbot",
          message: text + attachNote,
        }),
      });
      if(!resp.ok) throw new Error('http '+resp.status);
      const data = await resp.json();
      if(data.error) throw new Error(data.error);
      const id = data.ticket.id;
      hideTyping();
      botSay("<span class=\"success-pop\">✓</span>Merci, votre réclamation a bien été enregistrée !", null, 500);
      setTimeout(()=> showTicketRemote(id), 950);
    }catch(e){
      hideTyping();
      botSay("Désolé, une erreur est survenue et votre réclamation n'a pas pu être enregistrée en ligne. Merci de contacter directement l'agence au 05 22 42 06 06.");
    }
    return;
  }

  showTyping();
  const intent = keywordFallback(text.toLowerCase());
  hideTyping();

  if(intent==='urgence'){
    handleUrgence();
  } else if(intent==='faq'){
    handleFAQ();
  } else if(intent==='suivi'){
    handleSuivi();
  } else if(intent==='reclamation'){
    handleReclamation();
  } else {
    addBot("Je n'ai pas bien compris. Choisissez une option ci-dessous :");
    addChoices([
      {id:'urgence', label:'🚨 Urgence'},
      {id:'faq', label:'📚 FAQ'},
      {id:'reclamation', label:'📋 Réclamation'},
      {id:'suivi', label:'🔍 Suivi'},
    ], route);
  }
}
